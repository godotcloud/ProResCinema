name: Build ProResCinemaCam iOS App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    name: Build iOS App & Package Unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto-Extract ZIP & Normalize Directory Structure
        run: |
          set -e
          # 1. Always extract any uploaded .zip archive (even if project.yml already exists in root)
          for z in *.zip; do
            if [ -f "$z" ]; then
              echo "Extracting $z..."
              unzip -o "$z"
            fi
          done

          # 2. Ensure target source & resource directories exist for XcodeGen
          mkdir -p ProResCinemaCam/Sources
          mkdir -p ProResCinemaCam/Resources

          # 3. Copy Swift sources from either nested zip folders or root directory into ProResCinemaCam/Sources
          for swift_file in CameraEngine.swift VideoProcessor.swift ProResCinemaCamUI.swift; do
            if [ ! -f "ProResCinemaCam/Sources/$swift_file" ]; then
              FOUND_SWIFT=$(find . -name "$swift_file" | head -n 1)
              if [ -n "$FOUND_SWIFT" ]; then
                echo "Copying $FOUND_SWIFT -> ProResCinemaCam/Sources/$swift_file"
                cp "$FOUND_SWIFT" "ProResCinemaCam/Sources/$swift_file"
              fi
            fi
          done

          # 4. Ensure sample .cube LUT exists in ProResCinemaCam/Resources
          if [ ! -f "ProResCinemaCam/Resources/Rec709_Cinema.cube" ]; then
            FOUND_CUBE=$(find . -name "*.cube" | head -n 1)
            if [ -n "$FOUND_CUBE" ]; then
              cp "$FOUND_CUBE" "ProResCinemaCam/Resources/Rec709_Cinema.cube"
            else
              cat << 'EOF' > ProResCinemaCam/Resources/Rec709_Cinema.cube
          TITLE "HLG_to_Rec709_Cinema_Contrast"
          LUT_3D_SIZE 2
          DOMAIN_MIN 0.0 0.0 0.0
          DOMAIN_MAX 1.0 1.0 1.0
          0.000000 0.000000 0.000000
          0.920000 0.040000 0.020000
          0.030000 0.940000 0.030000
          0.960000 0.950000 0.050000
          0.020000 0.050000 0.950000
          0.950000 0.060000 0.930000
          0.040000 0.950000 0.960000
          1.000000 1.000000 1.000000
          EOF
            fi
          fi

          # 5. Ensure Info.plist exists at ProResCinemaCam/Info.plist
          if [ ! -f "ProResCinemaCam/Info.plist" ]; then
            FOUND_PLIST=$(find . -name "Info.plist" | head -n 1)
            if [ -n "$FOUND_PLIST" ]; then
              cp "$FOUND_PLIST" "ProResCinemaCam/Info.plist"
            fi
          fi

          # 6. Ensure project.yml is in the repository root
          if [ ! -f "project.yml" ]; then
            FOUND_PROJ=$(find . -name "project.yml" | head -n 1)
            if [ -n "$FOUND_PROJ" ]; then
              cp "$FOUND_PROJ" ./project.yml
            fi
          fi

          echo "Verified ProResCinemaCam directory contents:"
          ls -la ProResCinemaCam/Sources ProResCinemaCam/Resources

      - name: Verify Active Xcode Toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Install XcodeGen (if not pre-installed)
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode Project from project.yml
        run: |
          xcodegen generate --spec project.yml

      - name: Build for iOS Simulator (Syntax & SDK Verification)
        run: |
          xcodebuild clean build \
            -project ProResCinemaCam.xcodeproj \
            -scheme ProResCinemaCam \
            -destination "generic/platform=iOS Simulator" \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Generic iOS Device Archive (arm64 - iPhone 13 Pro Max Target)
        run: |
          xcodebuild clean build \
            -project ProResCinemaCam.xcodeproj \
            -scheme ProResCinemaCam \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Unsigned IPA for Sideloading / Enterprise Signing
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData -name "ProResCinemaCam.app" -path "*/Release-iphoneos/*" | head -n 1)
          echo "Found built app at: $APP_PATH"
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r9 ProResCinemaCam-Unsigned.ipa Payload
          ls -lh ProResCinemaCam-Unsigned.ipa

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProResCinemaCam-Unsigned-IPA
          path: build/ProResCinemaCam-Unsigned.ipa
          retention-days: 30
