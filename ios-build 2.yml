name: Build ProResCinemaCam iOS App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    name: Build iOS App & Package Unsigned IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Install XcodeGen (if not present)
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode Project from project.yml
        run: |
          xcodegen generate --spec project.yml

      - name: Build for iOS Simulator (Syntax & Type Verification)
        run: |
          xcodebuild clean build \
            -project ProResCinemaCam.xcodeproj \
            -scheme ProResCinemaCam \
            -sdk iphonesimulator \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Generic iOS Device Archive (arm64 - iPhone 13 Pro Max Target)
        run: |
          xcodebuild clean build \
            -project ProResCinemaCam.xcodeproj \
            -scheme ProResCinemaCam \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Unsigned IPA for Sideloading / Enterprise Signing
        run: |
          mkdir -p build/Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/ProResCinemaCam.app build/Payload/
          cd build
          zip -r9 ProResCinemaCam-Unsigned.ipa Payload
          ls -lh ProResCinemaCam-Unsigned.ipa

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProResCinemaCam-Unsigned-IPA
          path: build/ProResCinemaCam-Unsigned.ipa
          retention-days: 30
